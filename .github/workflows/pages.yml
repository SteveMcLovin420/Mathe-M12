name: Quarto auf GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Präsentation (Quarto)/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.27'
      - name: Nur Vortrag und Begleitaufgaben rendern
        working-directory: 'Präsentation (Quarto)'
        run: |
          quarto render
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'Präsentation (Quarto)/_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
